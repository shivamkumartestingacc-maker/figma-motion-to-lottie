<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Figma Motion → dotLottie</title>
  <style>
    :root {
      --bg: var(--figma-color-bg, #ffffff);
      --bg2: var(--figma-color-bg-secondary, #f5f5f5);
      --text: var(--figma-color-text, #1e1e1e);
      --text2: var(--figma-color-text-secondary, #7c7c7c);
      --border: var(--figma-color-border, #e6e6e6);
      --accent: var(--figma-color-bg-brand, #0d99ff);
      --accent-text: var(--figma-color-text-onbrand, #ffffff);
      --danger: #e03e3e;
      --ok: #14ae5c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      flex: none;
    }
    header h1 { font-size: 12px; font-weight: 600; }
    header .badge { font-size: 10px; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); padding: 2px 8px; border-radius: 99px; }
    main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

    .stage {
      flex: 1; min-height: 180px; display: flex; align-items: center; justify-content: center;
      background:
        linear-gradient(45deg, var(--bg2) 25%, transparent 25%, transparent 75%, var(--bg2) 75%),
        linear-gradient(45deg, var(--bg2) 25%, transparent 25%, transparent 75%, var(--bg2) 75%);
      background-color: var(--bg);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
    }
    #player { width: 100%; height: 100%; overflow: hidden; }
    #player svg { max-width: 100%; max-height: 100%; image-rendering: auto; }
    .hint { color: var(--text2); text-align: center; padding: 16px; }
    .hint strong { display: block; color: var(--text); margin-bottom: 6px; }
    .error-box { color: var(--danger); text-align: center; padding: 18px 14px; overflow: auto; }

    .transport {
      display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center;
      padding: 8px 12px; border-top: 1px solid var(--border); flex: none;
    }
    button {
      font: inherit; color: var(--text); background: var(--bg2);
      border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
    button.primary:hover { filter: brightness(1.05); }
    button.ghost { background: transparent; }
    button:disabled { opacity: 0.45; cursor: default; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .time { font-variant-numeric: tabular-nums; color: var(--text2); min-width: 54px; text-align: right; }

    .panel { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; flex: none; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row label { flex: none; color: var(--text2); }
    .row .grow { flex: 1; }
    input[type="text"], select {
      font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 8px; width: 100%;
    }
    .chk { display: flex; gap: 6px; align-items: center; color: var(--text); cursor: pointer; }
    .chk input { accent-color: var(--accent); }
    .export { display: flex; gap: 8px; }
    .export button { flex: 1; }

    .warnings {
      max-height: 110px; overflow: auto; border-top: 1px solid var(--border); flex: none;
      font-size: 11px; color: var(--text2); padding: 6px 12px;
    }
    .warnings h2 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; color: var(--text); }
    .warnings ul { padding-left: 14px; }
    .warnings.hidden { display: none; }

    .toast {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 7px 14px; border-radius: 99px; font-size: 11px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>Figma Motion → dotLottie</h1>
    <span class="badge">keyframes · easing · dotLottie</span>
  </header>

  <main>
    <section class="stage">
      <div class="hint" id="hint">
        <strong>Select a frame with your Motion animation</strong>
        The export happens here → run it from Figma’s plugin menu.
      </div>
      <div id="player"></div>
      <div class="error-box" id="error" hidden></div>
    </section>

    <section class="transport" id="transport" hidden>
      <button id="playBtn" title="Play / Pause">Pause</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" />
      <span class="time" id="time">0.00s</span>
    </section>

    <section class="panel" id="panel" hidden>
      <div class="row">
        <label for="name" style="width:52px">Name</label>
        <input type="text" id="name" class="grow" />
      </div>
      <div class="row">
        <label for="fps" style="width:52px">Frame rate</label>
        <select id="fps">
          <option value="30">30 fps</option>
          <option value="60" selected>60 fps</option>
          <option value="120">120 fps</option>
        </select>
        <label class="chk"><input type="checkbox" id="loop" checked /> loop</label>
      </div>
      <div class="row">
        <div class="grow"></div>
        <div class="export">
          <button id="jsonBtn">JSON</button>
          <button id="lottieBtn" class="primary">Download .lottie</button>
        </div>
      </div>
    </section>
  </main>

  <section class="warnings hidden" id="warnings">
    <h2>Export notes</h2>
    <ul id="warningsList"></ul>
  </section>

  <div class="toast" id="toast"></div>

  <script src="ui.js"></script>
</body>
</html>
